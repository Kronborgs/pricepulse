stages:
  - validate
  - build
  - publish

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true

backend:validate:
  stage: validate
  image: python:3.12-slim
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - python --version
    - pip install --requirement backend/requirements.txt
  script:
    - python -m compileall -q backend/app
    - ruff check backend/app
    - |
      if [ -d backend/tests ]; then
        pytest backend/tests -q
      else
        echo "No backend/tests directory found; skipping pytest."
      fi

frontend:validate:
  stage: validate
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run build

docker:build:
  stage: build
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - docker info
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/backend:test-$CI_COMMIT_SHORT_SHA" backend
    - docker build --pull --build-arg NEXT_PUBLIC_API_URL= --build-arg NEXT_PUBLIC_BUILD_VERSION="$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/frontend:test-$CI_COMMIT_SHORT_SHA" frontend

docker:publish:
  stage: publish
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
      docker build --pull --build-arg PRICEPULSE_VERSION="$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/backend:latest" backend
      docker build --pull --build-arg NEXT_PUBLIC_API_URL= --build-arg NEXT_PUBLIC_BUILD_VERSION="$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/frontend:latest" frontend
      docker push "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
      docker push "$CI_REGISTRY_IMAGE/backend:latest"
      docker push "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
      docker push "$CI_REGISTRY_IMAGE/frontend:latest"