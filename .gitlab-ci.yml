stages:
  - validate
  - quality
  - build
  - publish

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true

variables:
  PRICEPULSE_REGISTRY_HOST: registry.kronborgs.dk
  PRICEPULSE_REGISTRY_IMAGE: registry.kronborgs.dk/kronborgs-lab/pricepulse

backend:validate:
  stage: validate
  image: python:3.12-slim
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - .cache/pip
  artifacts:
    when: always
    paths:
      - coverage.xml
    expire_in: 1 day
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - python --version
    - pip install --requirement backend/requirements.txt
  script:
    - python -m compileall -q backend/app
    - ruff check backend/app
    - |
      if [ -d backend/tests ]; then
        PYTHONPATH=backend pytest --cov=backend/app --cov-report=xml:coverage.xml backend/tests -q
      else
        echo "No backend/tests directory found; skipping pytest."
      fi

frontend:validate:
  stage: validate
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run build

sonarqube:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar
    paths:
      - .sonar/cache
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      PROJECT_KEY="${SONAR_PROJECT_KEY:-$CI_PROJECT_PATH_SLUG}"
      sonar-scanner \
        -Dsonar.projectKey="$PROJECT_KEY" \
        -Dsonar.projectName="$CI_PROJECT_PATH" \
        -Dsonar.projectVersion="$CI_COMMIT_SHORT_SHA" \
        -Dsonar.sources=backend/app,frontend/src \
        -Dsonar.exclusions="**/__pycache__/**,**/node_modules/**,**/.next/**,**/dist/**" \
        -Dsonar.python.version=3.12 \
        -Dsonar.python.coverage.reportPaths=coverage.xml \
        -Dsonar.typescript.tsconfigPath=frontend/tsconfig.json \
        -Dsonar.host.url="$SONAR_HOST_URL" \
        -Dsonar.token="$SONAR_TOKEN" \
        -Dsonar.qualitygate.wait=true
docker:build:
  stage: build
  image: docker:27.5.1

  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - docker info
  script:
    - docker build --pull -t "$PRICEPULSE_REGISTRY_IMAGE/backend:test-$CI_COMMIT_SHORT_SHA" backend
    - docker build --pull --build-arg NEXT_PUBLIC_API_URL= --build-arg NEXT_PUBLIC_BUILD_VERSION="$CI_COMMIT_SHORT_SHA" -t "$PRICEPULSE_REGISTRY_IMAGE/frontend:test-$CI_COMMIT_SHORT_SHA" frontend

docker:publish:
  stage: publish
  image: docker:27.5.1

  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$PRICEPULSE_REGISTRY_HOST" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
      docker build --pull --build-arg PRICEPULSE_VERSION="$IMAGE_TAG" -t "$PRICEPULSE_REGISTRY_IMAGE/backend:$IMAGE_TAG" -t "$PRICEPULSE_REGISTRY_IMAGE/backend:latest" backend
      docker build --pull --build-arg NEXT_PUBLIC_API_URL= --build-arg NEXT_PUBLIC_BUILD_VERSION="$IMAGE_TAG" -t "$PRICEPULSE_REGISTRY_IMAGE/frontend:$IMAGE_TAG" -t "$PRICEPULSE_REGISTRY_IMAGE/frontend:latest" frontend
      docker push "$PRICEPULSE_REGISTRY_IMAGE/backend:$IMAGE_TAG"
      docker push "$PRICEPULSE_REGISTRY_IMAGE/backend:latest"
      docker push "$PRICEPULSE_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
      docker push "$PRICEPULSE_REGISTRY_IMAGE/frontend:latest"